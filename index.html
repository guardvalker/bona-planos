<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#18222c">
<title>Plano eléctrico rápido</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="styles.css">
</head>
<body data-view="home">

<main id="home">
  <div class="home-top">
    <h1 data-i18n="home.title"></h1>
    <span class="home-actions"><button id="hImport" data-i18n="home.import"></button><button id="hNew" class="primary" data-i18n="home.new"></button></span>
  </div>
  <p id="hWarn" class="warn" hidden data-i18n="home.notPersistent"></p>
  <div id="hList" data-i18n-aria="home.list"></div>
</main>

<div id="editor">
<header id="head">
  <button id="bBack" data-i18n-aria="nav.backAria">‹ <span data-i18n="nav.back"></span></button>
  <input id="pname" type="text" maxlength="80" data-i18n-aria="plan.name">
</header>
<div id="bar" role="toolbar"></div>
<div id="hint" aria-live="polite"></div>

<div id="stage">
  <svg id="cv" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <pattern id="g1" width="10" height="10" patternUnits="userSpaceOnUse">
        <path d="M10 0H0V10" fill="none" stroke="var(--grid2)" stroke-width="1"/>
      </pattern>
      <pattern id="g4" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M40 0H0V40" fill="none" stroke="var(--grid)" stroke-width="1.2"/>
      </pattern>
    </defs>
    <g id="world">
      <rect x="-4000" y="-4000" width="8000" height="8000" fill="url(#g1)" pointer-events="none"/>
      <rect x="-4000" y="-4000" width="8000" height="8000" fill="url(#g4)" pointer-events="none"/>
      <g id="scene"></g>
    </g>
  </svg>
  <div id="zoom">
    <button id="zIn" data-i18n-aria="zoom.in">+</button>
    <button id="zOut" data-i18n-aria="zoom.out">−</button>
  </div>
</div>

<div id="dock">
  <div id="chips" data-i18n-aria="circuit.list"></div>
  <div id="selrow"></div>
  <details id="legend">
    <summary data-i18n="legend.title"></summary>
    <div id="legendBody"></div>
  </details>
  <details id="cedit">
    <summary data-i18n="circuit.edit"></summary>
    <div id="clist"></div>
    <button id="cAdd" data-i18n="circuit.add"></button>
  </details>
</div>
</div>

<div id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="box">
    <strong id="mTitle" data-i18n="data.title"></strong>
    <div class="help" data-i18n="data.help"></div>
    <textarea id="json" spellcheck="false"></textarea>
    <div id="msg" aria-live="polite"></div>
    <div class="row">
      <button id="mCopy" data-i18n="data.copy"></button>
      <button id="mDown" data-i18n="data.download"></button>
      <button id="mFile" data-i18n="data.file"></button>
      <button id="mLoad" data-i18n="data.load"></button>
      <button id="mClose" data-i18n="data.close"></button>
    </div>
  </div>
</div>

<div id="exp" class="overlay" role="dialog" aria-modal="true" aria-labelledby="eTitle">
  <div class="box">
    <strong id="eTitle" data-i18n="exp.title"></strong>
    <div class="help" data-i18n="exp.help"></div>
    <div class="row">
      <button id="ePng" data-i18n="exp.png"></button>
      <button id="eSvg" data-i18n="exp.svg"></button>
      <button id="ePrint" data-i18n="exp.print"></button>
    </div>
    <div class="row"><button id="eClose" data-i18n="data.close"></button></div>
  </div>
</div>

<input type="file" id="fileEditor" accept=".json,application/json" hidden>
<input type="file" id="fileHome" accept=".json,application/json" hidden>
<div id="printArea" aria-hidden="true"></div>

<div id="ask" class="overlay" role="dialog" aria-modal="true" aria-labelledby="aTitle">
  <form class="box">
    <strong id="aTitle"></strong>
    <input id="aInput" type="text" maxlength="80">
    <div class="row">
      <button type="submit" id="aOk" data-i18n="ask.ok"></button>
      <button type="button" id="aCancel" data-i18n="ask.cancel"></button>
    </div>
  </form>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
